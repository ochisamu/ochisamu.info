name: Weekly Tech Clips Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'weekly-tech-clips-')
    runs-on: ubuntu-latest

    steps:
      - name: Close processed tech clip issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE_NUMBERS=$(printf '%s\n' "$PR_BODY" \
            | sed -n '/weekly-tech-clips-issues/,/-->/p' \
            | grep -Eo '#[0-9]+' \
            | tr -d '#' \
            | sort -n \
            | uniq)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No weekly tech clip issue numbers found in PR body"
            exit 0
          fi

          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            echo "Marking issue #${ISSUE_NUMBER} as posted"

            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels" \
              -d '{"name":"tech-clip-posted","color":"0E8A16","description":"Weekly tech clip article has been published"}' \
              -o /dev/null

            curl -sS -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/tech-clip" \
              -o /dev/null

            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
              -d '{"labels":["tech-clip-posted"]}' \
              -o /dev/null

            curl -sS -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -d '{"state":"closed","state_reason":"completed"}' \
              -o /dev/null
          done

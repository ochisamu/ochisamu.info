# .github/workflows/weekly-tech-clips.yml
name: Weekly Tech Clips

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0" # Sun 23:00 JST

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-weekly-tech-clips.txt

      - name: Install weekly tech clips dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-weekly-tech-clips.txt

      - name: Generate weekly tech clips article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
          OPENAI_WEB_SEARCH: "true"
          GENERATE_COVER_IMAGE: "true"
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_QUALITY: high
        run: .venv/bin/python scripts/generate-weekly-tech-clips.py

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="weekly-tech-clips-${GITHUB_RUN_ID}"
          BASE="master"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/content/blog

          git status --short

          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi

          git commit -m "Add weekly tech clips"
          git push origin "$BRANCH"

          ISSUE_LIST=$(find src/content/blog -path '*/tech-clips/*/clips.json' -print \
            | sort \
            | tail -n 1 \
            | xargs jq -r '.issues[] | "- #" + (.number | tostring) + ": " + .sourceUrl + " (" + .fetchStatus + ")"')

          PR_BODY=$(cat <<EOF
          スマホから保存した tech-clip Issue をもとに週次まとめ記事を生成しました。

          <!-- weekly-tech-clips-issues
          ${ISSUE_LIST}
          -->

          ## 対象 Issue

          ${ISSUE_LIST}
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg title "Weekly Tech Clips ${GITHUB_RUN_ID}" \
            --arg head "$BRANCH" \
            --arg base "$BASE" \
            --arg body "$PR_BODY" \
            '{
              title: $title,
              head: $head,
              base: $base,
              body: $body
            }'
          )

          for i in 1 2 3; do
            echo "Creating pull request... attempt $i"

            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
              -d "$PAYLOAD")

            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "GitHub API status: $STATUS"

            if [ "$STATUS" = "201" ]; then
              echo "Pull request created:"
              echo "$BODY" | jq -r '.html_url'
              exit 0
            fi

            echo "$BODY"

            if [ "$i" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "Failed to create pull request"
          exit 1

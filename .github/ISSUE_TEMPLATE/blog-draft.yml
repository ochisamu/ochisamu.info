# .github/ISSUE_TEMPLATE/tech-clip.yml
name: Tech Clip
description: 読んだ技術記事への一言メモ
title: "[clip] "
labels: ["tech-clip"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: 読んだ記事のURL
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: comment
    attributes:
      label: ひとことコメント
      description: 思ったことを短く。箇条書きでもOK。
      placeholder: "この設計、AIチャットの会話履歴管理にも使えそう。"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: タグ
            - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi

          BRANCH="weekly-tech-clips-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/content/blog
          git status --short

          git commit -m "Add weekly tech clips"
          git push origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Weekly Tech Clips ${GITHUB_RUN_ID}" \
            --body "スマホから保存した tech-clip Issue をもとに週次まとめ記事を生成しました。"
      placeholder: "AI, Astro, LangGraph, Keyboard"

  - type: dropdown
    id: importance
    attributes:
      label: 扱い
      options:
        - 週次まとめに入れる
        - あとで深掘りしたい
        - 単なるメモ
    validations:
      required: true
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .box{fill:#eef4ff;stroke:#244a9a;stroke-width:3;rx:14}
    .t{font:24px sans-serif;fill:#111}
    .small{font:20px sans-serif;fill:#111}
    .arrow{stroke:#333;stroke-width:4;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <text x="40" y="55" class="t">Weekly Tech Clips 自動生成フロー</text>
  <rect class="box" x="40" y="110" width="280" height="120"/><text x="60" y="160" class="small">1. GitHub Issue</text><text x="60" y="190" class="small">tech-clip ラベル</text>
  <rect class="box" x="380" y="110" width="300" height="120"/><text x="400" y="160" class="small">2. Python スクリプト</text><text x="400" y="190" class="small">Issue解析 / URL抽出</text>
  <rect class="box" x="740" y="110" width="380" height="120"/><text x="760" y="160" class="small">3. 記事本文取得</text><text x="760" y="190" class="small">BeautifulSoupで整形</text>
  <rect class="box" x="220" y="380" width="350" height="120"/><text x="240" y="430" class="small">4. DeepAgents</text><text x="240" y="460" class="small">article-reader / editor</text>
  <rect class="box" x="660" y="380" width="420" height="120"/><text x="680" y="430" class="small">5. Markdown / JSON 出力</text><text x="680" y="460" class="small">src/content/blog/YYYY/tech-clips/DATE</text>
  <line class="arrow" x1="320" y1="170" x2="380" y2="170"/>
  <line class="arrow" x1="680" y1="170" x2="740" y2="170"/>
  <line class="arrow" x1="930" y1="230" x2="520" y2="380"/>
  <line class="arrow" x1="570" y1="440" x2="660" y2="440"/>
</svg>
